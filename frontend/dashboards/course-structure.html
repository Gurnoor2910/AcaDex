<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Architecture | Acadex</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
      .course-tree { margin-top: 2.5rem; }
      .course-node { margin-bottom: 3rem; overflow: visible; }
      
      .course-header { 
          font-size: 1.5rem; 
          font-weight: 900; 
          text-transform: uppercase; 
          color: var(--primary); 
          margin-bottom: 2rem; 
          padding-bottom: 1rem; 
          border-bottom: 3px solid var(--border-bold); 
      }
      
      summary { list-style: none; outline: none; cursor: pointer; }
      summary::-webkit-details-marker { display: none; }
      
      details { 
          margin: 1.5rem 0; 
          border: 2px solid var(--border-bold); 
          background: var(--bg-primary); 
          padding: 1rem;
          transition: all 0.2s ease;
      }
      details[open] { background: var(--bg-secondary); box-shadow: 4px 4px 0px var(--border-bold); }
      details[open] .fa-chevron-right { transform: rotate(90deg); }
      
      .sem-header { 
          font-weight: 900; 
          text-transform: uppercase; 
          display: flex; 
          align-items: center; 
          justify-content: space-between; 
          font-size: 0.9rem;
      }
      
      .sem-badge { 
          font-size: 0.65rem; 
          padding: 0.2rem 0.6rem; 
          background: var(--success); 
          color: white; 
          font-weight: 800; 
          border: 1.5px solid var(--border-bold); 
          margin-left: 1rem; 
          border-radius: 2px;
      }
      
      .sem-header::-webkit-details-marker { display: none; }
      .sem-header { cursor: pointer; list-style: none; outline: none; }
      .sub-grid { 
          display: grid; 
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
          gap: 1.5rem; 
          margin-top: 1.5rem; 
          padding: 1rem; 
          background: var(--bg-primary); 
          border-top: 2px solid var(--border-bold); 
      }
      
      .sub-card { 
          background: var(--bg-secondary); 
          border: 2px solid var(--border-bold); 
          padding: 1.25rem; 
          display: flex; 
          flex-direction: column; 
          box-shadow: 3px 3px 0px var(--border-bold);
      }
      
      .sub-name { font-weight: 900; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--primary); }
      .sub-meta { font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 0.25rem; }
      
      .selector-overlay { 
          margin-bottom: 2rem; 
          padding: 1.5rem; 
          background: var(--bg-secondary); 
          border: 2px solid var(--border-bold); 
          box-shadow: var(--shadow); 
          display: none; 
          align-items: center; 
          gap: 1.5rem;
      }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <div class="container">
      <!-- Navbar auto-injected by layout.js -->

      <div class="header-row">
        <div>
          <h2>Academic Architecture</h2>
          <p style="color: var(--text-secondary);">Structural visualization and management of the institutional curriculum hierarchy</p>
        </div>
      </div>

      <div id="course-selector-container" class="selector-overlay">
          <div style="flex: 1;">
              <label style="font-size: 0.7rem; font-weight: 900; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Select Institutional Program</label>
              <select id="course-dropdown" style="width: 100%; max-width: 400px;" onchange="renderSpecificCourse(this.value)">
                  <option value="all">ALL AUTHORIZED PROGRAMS</option>
              </select>
          </div>
          <div style="font-size: 0.7rem; font-weight: 900; color: var(--primary); background: var(--bg-primary); padding: 0.5rem 1rem; border: 2px solid var(--border-bold);">ADMIN PRIVILEGE ENABLED</div>
      </div>

      <div id="tree-container" class="course-tree">
          <div style="text-align: center; padding: 5rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">
              Synchronizing with academic registry...
          </div>
      </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/courses.js"></script>
  <script>
    checkAuth();
    CourseService.initSync();

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            await CourseService.loadCourseData();
            window.renderUI();
        } catch(e) { console.error("Architecture sync failure", e); }
    });

    window.renderUI = function() {
        const fullStructure = window.courseData || [];
        const container = document.getElementById("tree-container");
        
        if (!fullStructure || fullStructure.length === 0) {
            container.innerHTML = "<div style='text-align: center; padding: 4rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;'>No program structures identified in the registry.</div>";
            return;
        }

        const selector = document.getElementById("course-selector-container");
        const dropdown = document.getElementById("course-dropdown");
        
        if (fullStructure.length > 1) {
            selector.style.display = "flex";
            if (dropdown.options.length <= 1) {
                dropdown.innerHTML = '<option value="all">ALL AUTHORIZED PROGRAMS</option>' + 
                    fullStructure.map(c => `<option value="${c.id}">${c.courseName.toUpperCase()}</option>`).join('');
            }
        }

        const selectedCid = dropdown.value;
        const filtered = selectedCid === "all" ? fullStructure : fullStructure.filter(c => c.id === selectedCid);
        renderFilteredTree(filtered);
    }

    function renderSpecificCourse(cid) { window.renderUI(); }

    function renderFilteredTree(courses) {
        const container = document.getElementById("tree-container");
        container.innerHTML = courses.map(c => `
            <div class="glass-card course-node">
                <div class="course-header">${c.courseName.toUpperCase()}</div>
                <div class="sem-container">
                    ${(c.semesters || []).map(s => {
                        const isCurrent = s.currentSemester === true;
                        return `
                            <details ${isCurrent ? 'open' : ''}>
                                  <summary class="sem-header">
                                    <span style="display: flex; align-items: center; gap: 0.5rem;">
                                        <i class="fas fa-chevron-right" style="font-size: 0.7rem; transition: transform 0.2s;"></i>
                                        CYCLE SEMESTER ${s.semesterNumber}
                                        ${isCurrent ? '<span class="sem-badge">ACTIVE CYCLE</span>' : ''}
                                    </span>
                                    <span style="font-family: monospace; font-weight: 800; opacity: 0.7;">[${(s.subjects || []).length} UNITS]</span>
                                </summary>
                                <div class="sub-grid">
                                    ${(s.subjects || []).length > 0 
                                        ? s.subjects.map(sub => `
                                            <div class="sub-card">
                                                <div class="sub-name">${sub.subjectName.toUpperCase()}</div>
                                                <div class="sub-meta">PERSONNEL: ${sub.facultyName ? sub.facultyName.toUpperCase() : 'NOT ASSIGNED'}</div>
                                                <div class="sub-meta" style="font-family: monospace; opacity: 0.6; margin-top: auto; border-top: 1px dashed var(--border-bold); padding-top: 0.5rem;">REG_CODE: ${sub.subjectCode}</div>
                                            </div>
                                        `).join('')
                                        : '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">No units mapped to this cycle.</div>'
                                    }
                                </div>
                            </details>
                        `;
                    }).join('')}
                </div>
            </div>
        `).join('');

        setTimeout(() => {
            const current = document.querySelector('.sem-badge');
            if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
    }
  </script>
</body>
</html>

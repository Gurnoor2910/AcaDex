<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Intelligence | Acadex</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-layout">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <!-- Navbar auto-injected by layout.js -->

      <div class="header-row">
        <div>
          <h2>Attendance Intelligence</h2>
          <p style="color: var(--text-secondary);">Comprehensive cross-sectional registry reporting and audit logs</p>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='mark-attendance.html'"><i class="fas fa-bolt"></i> MARK NEW SESSION</button>
      </div>

      <!-- Analytical Filters -->
      <div class="glass-card" style="margin-bottom: 2.5rem; display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap;">
        <div class="input-group" style="flex: 1; min-width: 250px; margin-bottom: 0;">
          <label>Session Timestamp</label>
          <input type="date" id="filter-date">
        </div>
        <div class="input-group" style="flex: 1; min-width: 250px; margin-bottom: 0;">
          <label>Academic Unit (Subject)</label>
          <select id="filter-subject">
            <option value="">ALL SUBJECTS</option>
            <option value="Mathematics">MATHEMATICS</option>
            <option value="Physics">PHYSICS</option>
            <option value="Chemistry">CHEMISTRY</option>
            <option value="Computer Science">COMPUTER SCIENCE</option>
            <option value="English">ENGLISH</option>
          </select>
        </div>
        <div style="display: flex; gap: 1rem; flex: 1; min-width: 250px;">
            <button onclick="applyFilters()" class="btn btn-primary" style="flex: 1; height: 50px; padding: 0 1rem;">FILTER REGISTRY</button>
            <button onclick="clearFilters()" class="btn btn-secondary" style="height: 50px;">RESET</button>
        </div>
      </div>

      <div class="glass-card">
        <h3 style="margin-bottom: 2rem; text-transform: uppercase; font-weight: 900;">Global Attendance Registry</h3>
        <div class="table-container">
          <table id="report-table">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Candidate Candidate</th>
                <th>Academic Unit</th>
                <th>Presence Status</th>
                <th>Authorized By</th>
                <th style="text-align: right;">Operations</th>
              </tr>
            </thead>
            <tbody id="report-body">
              <tr><td colspan="6" style="text-align: center; padding: 3rem; color: var(--text-secondary);">Synchronizing registry logs...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Adjustment Modal -->
      <div id="edit-modal" class="modal-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-card" style="width: 100%; max-width: 450px;">
            <h3 style="margin-bottom: 2rem; color: var(--primary); text-transform: uppercase; font-weight: 900;">Modify Registry Entry</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-student-id">
                <input type="hidden" id="edit-record-id">
                
                <div class="input-group">
                    <label>Correction Date</label>
                    <input type="date" id="edit-date" required>
                </div>

                <div class="input-group">
                    <label>Academic Unit</label>
                    <select id="edit-subject" required>
                        <option value="Mathematics">MATHEMATICS</option>
                        <option value="Physics">PHYSICS</option>
                        <option value="Chemistry">CHEMISTRY</option>
                        <option value="Computer Science">COMPUTER SCIENCE</option>
                        <option value="English">ENGLISH</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Updated Status</label>
                    <select id="edit-status" required>
                        <option value="present">PRESENT</option>
                        <option value="absent">ABSENT</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 2; justify-content: center;" id="save-btn">COMMIT UPDATE</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1; justify-content: center;" onclick="closeEditModal()">CANCEL</button>
                </div>
            </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/attendance.js"></script>
  <script>
    let logsData = [];

    document.addEventListener("DOMContentLoaded", async () => {
      checkAuth();
      const user = JSON.parse(localStorage.getItem("acadex_user"));
      const is_admin = user && user.role === "admin";

      async function loadLogs(date = "", subject = "") {
          const tbody = document.getElementById("report-body");
          try {
              const logs = await AttendanceService.getClassAttendance(date, subject);
              logsData = logs;
              if (!logs || logs.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 3rem;">No attendance records discovered matching these filters.</td></tr>';
                  return;
              }
              tbody.innerHTML = logs.map(l => `
                <tr id="row-${l.id}">
                    <td style="font-weight: 700;">${new Date(l.date).toLocaleDateString('en-GB')}</td>
                    <td>
                        <div style="font-weight: 800; text-transform: uppercase;">${l.studentName || 'UNKNOWN'}</div>
                        <div style="font-size: 0.65rem; color: var(--text-secondary); font-family: monospace;">#${(l.studentId || '').substring(0,8)}</div>
                    </td>
                    <td style="font-weight: 700; color: var(--primary);">${l.subject.toUpperCase()}</td>
                    <td>
                        <span class="status-pill ${l.status === 'present' ? 'pill-success' : 'pill-danger'}">
                            ${l.status.toUpperCase()}
                        </span>
                        ${l.lastUpdatedAt ? '<div style="font-size: 0.55rem; color: var(--primary); font-weight: 900; margin-top: 4px; text-transform: uppercase;">[ADJUSTED ENTRY]</div>' : ''}
                    </td>
                    <td style="font-weight: 700; font-size: 0.8rem;">PROF. ${(l.teacherName || 'SYSTEM').toUpperCase()}</td>
                    <td style="text-align: right;">
                        <button onclick='openEditModal("${l.studentId}", "${l.id}")' class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">ADJUST</button>
                    </td>
                </tr>
              `).join('');
          } catch(e) { 
              console.error("REGISTRY ACCESS FAILURE:", e);
              tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--danger); padding: 2rem;">CRITICAL ERROR: ' + e.message + '</td></tr>'; 
          }
      }

      window.openEditModal = (studentId, recordId) => {
          const record = logsData.find(l => l.id === recordId && l.studentId === studentId);
          if(!record) return;

          document.getElementById("edit-student-id").value = studentId;
          document.getElementById("edit-record-id").value = recordId;
          document.getElementById("edit-date").value = record.date;
          document.getElementById("edit-subject").value = record.subject;
          document.getElementById("edit-status").value = record.status;
          
          document.getElementById("edit-modal").style.display = "flex";
      }

      window.closeEditModal = () => document.getElementById("edit-modal").style.display = "none";

      document.getElementById("edit-form").onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById("save-btn");
          const data = {
              studentId: document.getElementById("edit-student-id").value,
              recordId: document.getElementById("edit-record-id").value,
              date: document.getElementById("edit-date").value,
              subject: document.getElementById("edit-subject").value,
              status: document.getElementById("edit-status").value
          };

          try {
              btn.disabled = true;
              btn.innerText = "TRANSMITTING...";
              await AttendanceService.update(data);
              alert("REGISTRY MODIFICATION AUTHORIZED.");
              closeEditModal();
              loadLogs();
          } catch(err) {
              alert("ADJUSTMENT FAILURE: " + err.message);
          } finally {
              btn.disabled = false;
              btn.innerText = "COMMIT UPDATE";
          }
      };

      window.applyFilters = () => {
          const date = document.getElementById("filter-date").value;
          const subject = document.getElementById("filter-subject").value;
          loadLogs(date, subject);
      };

      window.clearFilters = () => {
          document.getElementById("filter-date").value = "";
          document.getElementById("filter-subject").value = "";
          loadLogs();
      };

      firebase.auth().onAuthStateChanged(user => { if(user) loadLogs(); });
    });
  </script>
</body>
</html>

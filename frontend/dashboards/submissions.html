<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Audit | Acadex</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-layout">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <!-- Navbar auto-injected by layout.js -->

      <div class="header-row">
        <div>
          <h2>Submission Audit & Grading</h2>
          <p id="sub-desc" style="color: var(--text-secondary); font-weight: 800; text-transform: uppercase; font-size: 0.75rem;">Initializing task audit parameters...</p>
        </div>
        <button onclick="history.back()" class="btn btn-secondary">← RETURN TO TASK LIST</button>
      </div>

      <div class="glass-card" style="margin-top: 2.5rem; padding: 0; overflow: hidden; border-width: 2px;">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Status</th>
                <th>Submitted At</th>
                <th>Actions</th>
                <th>Marks</th>
              </tr>
            </thead>
            <tbody id="subs-tbody">
               <tr><td colspan="6" style="text-align: center; padding: 4rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">Synchronizing submission registry...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Grading Overlay -->
  <div id="grade-modal" class="modal-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center;">
      <div class="glass-card" style="width: 100%; max-width: 450px;">
          <h3 style="margin-bottom: 2rem; color: var(--primary); text-transform: uppercase; font-weight: 900;">Commit Assessment</h3>
          <form id="grade-form">
              <input type="hidden" id="g-student-id">
              <div class="input-group">
                <label>Institutional Marks Awarded</label>
                <input type="number" id="g-marks" required step="0.1" min="0" placeholder="0.0">
              </div>
              <div class="input-group">
                  <label>Audit Feedback & Observations (Optional)</label>
                  <textarea id="g-feedback" rows="4" placeholder="Institutional feedback for candidate improvement..."></textarea>
              </div>
              <div style="display: flex; gap: 1.5rem; margin-top: 2.5rem;">
                  <button type="submit" class="btn btn-primary" id="save-btn" style="flex: 2; justify-content: center; height: 50px;">COMMIT ASSESSMENT</button>
                  <button type="button" class="btn btn-secondary" onclick="document.getElementById('grade-modal').style.display='none'" style="flex: 1; justify-content: center; height: 50px;">CANCEL</button>
              </div>
          </form>
      </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/assignments.js"></script>
  <script>
    let assignmentId;
    let assignmentMax = 100;

    document.addEventListener("DOMContentLoaded", async () => {
      checkAuth();
      const user = JSON.parse(localStorage.getItem("acadex_user"));
      if (user && user.role === 'student') return window.location.href = "unauthorized.html";
      
      const params = new URLSearchParams(window.location.search);
      assignmentId = params.get('id');
      if (!assignmentId) return window.location.href = "assignments.html";
      
      try {
          // Get metadata from Assignments list
          const list = await AssignmentService.getAll();
          const assignment = list.find(a => a.id === assignmentId);
          if (assignment) {
              assignmentMax = assignment.maxMarks;
              document.getElementById("sub-desc").innerText = `TASK: ${assignment.title.toUpperCase()} (VERIFICATION MAX: ${assignmentMax})`;
          }
          loadSubmissions();
      } catch(e) { console.error("Registry access failure", e); }
    });

    async function loadSubmissions() {
        const tbody = document.getElementById("subs-tbody");
        try {
            const subs = await AssignmentService.getSubmissions(assignmentId);
            if(!subs || subs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 4rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">No candidate submissions discovered in this task cluster.</td></tr>';
                return;
            }

            tbody.innerHTML = subs.map(s => {
                const isGraded = s.status === 'graded';
                const studentName = s.studentName || 'Unknown Student';
                const submittedAt = s.submittedAt ? new Date(s.submittedAt) : new Date();
                
                console.log("Processing submission for:", studentName, s);

                return `
                    <tr>
                        <td style="font-weight: 900; text-transform: uppercase;">${studentName}</td>
                        <td>
                            <span class="status-pill ${isGraded ? 'pill-success' : 'pill-primary'}">
                                ${(s.status || 'SUBMITTED').toUpperCase()}
                            </span>
                        </td>
                        <td style="font-size: 0.75rem; font-weight: 700; font-family: monospace;">
                            ${submittedAt.toLocaleDateString('en-GB')}<br>
                            ${submittedAt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}
                        </td>
                        <td style="display: flex; gap: 0.5rem; border-bottom: none;">
                            <a href="${s.fileUrl}" target="_blank" class="btn btn-secondary" style="font-size: 0.65rem; padding: 0.4rem 0.8rem;">VIEW FILE</a>
                            <button class="btn btn-primary" onclick="openGradeModal('${s.studentId}', ${s.marksAwarded || 0}, \`${(s.feedback || '').replace(/`/g, '')}\`)" style="font-size: 0.7rem; padding: 0.4rem 0.8rem;">
                                ${isGraded ? 'GRADE' : 'GRADE'}
                            </button>
                        </td>
                        <td style="font-weight: 900; font-size: 1.1rem; color: ${isGraded ? 'var(--success)' : 'var(--text-secondary)'};">
                            ${isGraded ? s.marksAwarded : '--'} <span style="font-size: 0.75rem;">/ ${assignmentMax}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch(e) { 
            console.error("Submission registry sync failure", e); 
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--danger); font-weight: 900;">REGISTRY SYNC FAILURE: ${e.message.toUpperCase()}</td></tr>`;
        }
    }

    window.openGradeModal = (studentId, currentMarks, currentFeedback) => {
        document.getElementById("g-student-id").value = studentId;
        const marksInput = document.getElementById("g-marks");
        marksInput.max = assignmentMax;
        marksInput.value = currentMarks || '';
        document.getElementById("g-feedback").value = currentFeedback || '';
        document.getElementById("grade-modal").style.display = 'flex';
    };

    document.getElementById("grade-form").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("save-btn");
        const studentId = document.getElementById("g-student-id").value;
        const marks = parseFloat(document.getElementById("g-marks").value);
        const feedback = document.getElementById("g-feedback").value;
        
        try {
            btn.disabled = true;
            btn.innerText = "COMTTING ASSESSMENT...";
            await AssignmentService.grade(assignmentId, studentId, marks, feedback);
            document.getElementById("grade-modal").style.display = 'none';
            alert("ACADEMIC ASSESSMENT COMMITTED SUCCESSFULLY.");
            loadSubmissions();
        } catch(err) { 
            alert("ASSESSMENT FAILURE: " + err.message); 
        } finally {
            btn.disabled = false;
            btn.innerText = "COMMIT ASSESSMENT";
        }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievement Analytics | Acadex</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .score-high { color: var(--success); font-weight: 900; }
    .score-low { color: var(--danger); font-weight: 900; }
    .grade-badge { 
      padding: 0.2rem 0.6rem; 
      font-weight: 800; 
      font-size: 0.75rem; 
      border: 2px solid var(--border-bold); 
      background: var(--bg-primary);
      box-shadow: 2px 2px 0px var(--border-bold);
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-layout">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <!-- Navbar auto-injected by layout.js -->

      <div class="header-row">
        <div>
          <h2>Achievement Analytics</h2>
          <p style="color: var(--text-secondary);">Cross-sectional performance audits and grade distributions</p>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='marks-management.html'"><i class="fas fa-bolt"></i> INPUT NEW GRADES</button>
      </div>

      <div class="glass-card" style="margin-bottom: 2.5rem; display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap;">
        <div class="input-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
          <label>Academic Subject</label>
          <select id="filter-subject">
            <option value="">SCANNING CURRICULUM...</option>
          </select>
        </div>
        <div class="input-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
          <label>Audit Category (Exam)</label>
          <select id="filter-exam">
            <option value="">ALL ASSESSMENT TYPES</option>
            <option value="Midterm">MIDTERM EXAM</option>
            <option value="Final">FINAL EXAM</option>
            <option value="Assignment 1">ASSIGNMENT 01</option>
            <option value="Assignment 2">ASSIGNMENT 02</option>
            <option value="Project">PROJECT VIVA</option>
          </select>
        </div>
        <button onclick="applyFilters()" class="btn btn-primary" style="height: 50px; padding: 0 2rem;">FILTER REGISTRY</button>
        <button onclick="clearFilters()" class="btn btn-secondary" style="height: 50px;">RESET</button>
      </div>

      <div class="glass-card">
        <h3 style="margin-bottom: 2rem; text-transform: uppercase; font-weight: 900;">Global Achievement Log</h3>
        <div class="table-container">
          <table id="report-table">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Subject Candidate</th>
                <th>Subject</th>
                <th>Category</th>
                <th>Outcome</th>
                <th>Standing</th>
                <th style="text-align: right;">Operations</th>
              </tr>
            </thead>
            <tbody id="report-body">
              <tr><td colspan="7" style="text-align: center; padding: 3rem; color: var(--text-secondary);">Synchronizing performance records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Adjustment Modal -->
      <div id="edit-modal" class="modal-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-card" style="width: 100%; max-width: 400px;">
            <h3 style="margin-bottom: 2rem; color: var(--primary); text-transform: uppercase; font-weight: 900;">Modify Achievement</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-student-id">
                <input type="hidden" id="edit-record-id">
                
                <div class="input-group">
                    <label>Corrected Score</label>
                    <input type="number" id="edit-score" required min="0" step="0.1" placeholder="0.0">
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 2; justify-content: center;" id="save-btn">COMMIT UPDATE</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1; justify-content: center;" onclick="closeEditModal()">CANCEL</button>
                </div>
            </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/courses.js"></script>
  <script src="../js/marks.js"></script>
  <script>
    let marksData = [];
    let isAdmin = false;

    document.addEventListener("DOMContentLoaded", async () => {
      checkAuth();
      const user = JSON.parse(localStorage.getItem("acadex_user"));
      isAdmin = user && user.role === "admin";

      async function loadInitialData() {
          try {
              // Dynamically load subjects from curriculum
              const structure = await CourseService.getCurrentStructure();
              const subSelect = document.getElementById("filter-subject");
              const allSubjects = [];
              structure.forEach(c => {
                  c.semesters.forEach(s => {
                      s.subjects.forEach(sub => allSubjects.push(sub.subjectName));
                  });
              });
              const uniqueSubjects = [...new Set(allSubjects)].sort();
              subSelect.innerHTML = '<option value="">ALL SUBJECTS</option>' + 
                uniqueSubjects.map(s => `<option value="${s}">${s.toUpperCase()}</option>`).join('');
          } catch(e) { 
              console.error("Filter sync failure", e);
              document.getElementById("filter-subject").innerHTML = '<option value="">FAILED TO LOAD SUBJECTS</option>';
          }
      }

      async function loadMarks(subject = "", exam = "") {
          const tbody = document.getElementById("report-body");
          try {
              const records = await MarksService.getClassMarks(subject, exam);
              marksData = records;
              if (records.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">No matching achievement records discovered.</td></tr>';
                  return;
              }
              tbody.innerHTML = records.map(r => {
                  const perc = (r.score / r.maxMarks) * 100;
                  const scoreClass = perc >= 80 ? 'score-high' : (perc < 50 ? 'score-low' : '');
                  const grade = MarksService.getGrade(r.score, r.maxMarks);
                  
                  return `
                    <tr>
                        <td style="font-weight: 700;">${new Date(r.date).toLocaleDateString('en-GB')}</td>
                        <td style="font-weight: 800; text-transform: uppercase;">${r.studentName}</td>
                        <td style="font-weight: 800; color: var(--primary);">${(r.subject || 'N/A').toUpperCase()}</td>
                        <td style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">${r.examType}</td>
                        <td class="${scoreClass}" style="font-size: 1.1rem;">${r.score} <span style="font-size: 0.75rem; color: var(--text-secondary); -webkit-text-stroke: 0;">/ ${r.maxMarks}</span></td>
                        <td>
                            <span class="status-pill ${grade === 'A' || grade === 'B' ? 'pill-success' : (grade === 'F' ? 'pill-danger' : (grade === 'C' ? 'pill-info' : 'pill-warning'))}">
                                ${grade}
                            </span>
                        </td>
                        <td style="text-align: right;">
                            <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                                <button onclick='openEditModal("${r.studentId}", "${r.id}")' class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">EDIT</button>
                                <button onclick='deleteMark("${r.studentId}", "${r.id}")' class="btn btn-secondary" style="border-color: var(--danger); color: var(--danger); padding: 0.4rem 0.8rem; font-size: 0.7rem;">PURGE</button>
                            </div>
                        </td>
                    </tr>
                  `;
              }).join('');
          } catch(e) { 
              tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 2rem;">REGISTRY ACCESS FAILURE: ' + e.message + '</td></tr>'; 
          }
      }

      window.applyFilters = () => loadMarks(document.getElementById("filter-subject").value, document.getElementById("filter-exam").value);
      window.clearFilters = () => { document.getElementById("filter-subject").value = ""; document.getElementById("filter-exam").value = ""; loadMarks(); };

      window.openEditModal = (studentId, recordId) => {
          const record = marksData.find(r => r.id === recordId);
          if(!record) return;
          document.getElementById("edit-student-id").value = studentId;
          document.getElementById("edit-record-id").value = recordId;
          document.getElementById("edit-score").value = record.score;
          document.getElementById("edit-modal").style.display = "flex";
      }

      window.closeEditModal = () => document.getElementById("edit-modal").style.display = "none";

      document.getElementById("edit-form").onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById("save-btn");
          try {
              btn.disabled = true;
              btn.innerText = "TRANSMITTING...";
              await MarksService.updateMark({
                  studentId: document.getElementById("edit-student-id").value,
                  recordId: document.getElementById("edit-record-id").value,
                  score: parseFloat(document.getElementById("edit-score").value)
              });
              alert("Achievement Record Adjusted.");
              closeEditModal();
              applyFilters();
          } catch(err) { alert("ADJUSTMENT FAILURE: " + err.message); } 
          finally { btn.disabled = false; btn.innerText = "COMMIT UPDATE"; }
      };

      window.deleteMark = async (studentId, recordId) => {
          if(!confirm("CRITICAL: Permanently purge this achievement record from the registry?")) return;
          try {
              await MarksService.deleteMark(studentId, recordId);
              applyFilters();
          } catch(err) { alert("PURGE FAILURE: " + err.message); }
      };

      firebase.auth().onAuthStateChanged(user => { 
          if(user) {
              loadInitialData();
              loadMarks(); 
          } 
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Scheduler | Acadex</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/timetable.css">
  <style>
    /* Advanced Timetable CSS - Redesigned for Bold Layout */
    .tt-view-wrapper { 
      background: var(--bg-secondary); 
      border: 2px solid var(--border-bold); 
      box-shadow: var(--shadow); 
    }
    .tt-grid { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1000px; }
    .tt-grid th, .tt-grid td { padding: 1rem; border: 1px solid var(--border); text-align: center; }
    
    .sticky-col { position: sticky; left: 0; background: var(--bg-card) !important; z-index: 5; border-right: 2px solid var(--border-bold) !important; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; }
    thead tr th { position: sticky; top: 0; background: var(--text-primary) !important; color: var(--bg-primary) !important; z-index: 10; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    
    .tt-block { 
      background: var(--bg-primary); 
      border: 2px solid var(--border-bold);
      border-left: 6px solid var(--course-color); 
      padding: 0.75rem; 
      margin-bottom: 0.5rem; 
      text-align: left; 
      transition: transform 0.1s, box-shadow 0.1s; 
      cursor: pointer;
      position: relative;
      box-shadow: 3px 3px 0px var(--border-bold);
    }
    .tt-block:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-bold); }
    .tt-block:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px var(--border-bold); }

    .tt-course-tag { font-size: 0.6rem; font-weight: 900; color: var(--course-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.25rem; }
    .tt-subject { font-size: 0.9rem; font-weight: 800; margin-bottom: 0.4rem; color: var(--text-primary); line-height: 1.1; }
    .tt-meta { font-size: 0.65rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 2px; font-weight: 700; }
    
    .tt-legend { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 1.5rem; background: var(--bg-secondary); border: 2px solid var(--border-bold); box-shadow: var(--shadow); margin-bottom: 2.5rem; }
    .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
    .legend-dot { width: 12px; height: 12px; border: 1px solid var(--border-bold); }
    
    .current-slot { border-color: var(--primary) !important; transform: scale(1.02); z-index: 2; box-shadow: 6px 6px 0px var(--primary) !important; }
    
    .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; padding: 1.5rem; background: var(--bg-secondary); border: 2px solid var(--border-bold); box-shadow: var(--shadow); }
    .err-tag { background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 4px; font-weight: 900; margin-top: 5px; display: inline-block; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-layout">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <div class="container">
      <div class="header-row">
        <div>
          <h2>Academic Scheduler</h2>
          <p style="color: var(--text-secondary);">Master relational timetable and institutional capacity planning</p>
        </div>
        <div style="display: flex; gap: 1rem;">
             <button id="seed-tt-btn" class="btn btn-secondary" style="border-color: var(--primary); color: var(--primary);"><i class="fas fa-bolt"></i> SEED MODULE</button>
             <button id="cleanup-tt-btn" class="btn btn-secondary" style="border-color: var(--danger); color: var(--danger);"><i class="fas fa-recycle"></i> BATCH PURGE</button>
             <button id="scroll-today-btn" onclick="scrollToToday()" class="btn btn-primary"
               style="display:none; padding: 0.4rem 1rem; font-size: 0.75rem; font-weight: 900; height:auto; width:auto;">
               <i class="fas fa-crosshairs"></i> Today
             </button>
        </div>
      </div>

      <div class="scroll-hint" id="scroll-hint">
        <i class="fas fa-arrows-left-right"></i>
        Swipe left/right to see full schedule
      </div>

      <!-- Quick Entry Section -->
      <div class="glass-card" style="margin-bottom: 3rem;">
        <h3 style="margin-bottom: 2rem; text-transform: uppercase; font-weight: 900;">Schedule Academic Slot</h3>
        <form id="tt-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem;">
            <div class="input-group"><label>Course</label><select id="courseId" required><option value="">Select Target...</option></select></div>
            <div class="input-group"><label>Semester</label><select id="semId" required><option value="">Pick Course First</option></select></div>
            <div class="input-group"><label>Subject</label><select id="subjectId" required><option value="">Pick Semester First</option></select></div>
            <div class="input-group"><label>Primary Faculty</label><select id="facultyId" required disabled><option value="">Assigned by Subject</option></select></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-top: 1rem;">
            <div class="input-group"><label>Weekly Day</label><select id="day" required><option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option><option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option></select></div>
            <div class="input-group"><label>Time Window</label><select id="timeSlot" required><option value="09:00-10:00">09:00 - 10:00</option><option value="10:00-11:00">10:00 - 11:00</option><option value="11:15-12:15">11:15 - 12:15</option><option value="12:15-01:15">12:15 - 01:15</option><option value="02:00-03:00">02:00 - 03:00</option><option value="03:00-04:00">03:00 - 04:00</option><option value="04:00-05:00">04:00 - 05:00</option></select></div>
            <div class="input-group"><label>Room / Lab</label><input type="text" id="room" placeholder="e.g. Room 205" required></div>
            <div style="display: flex; align-items: flex-end; padding-bottom: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 50px;">COMMIT SLOT</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Legend & Contextual Filters -->
      <div id="tt-grid-container-legend"></div>
      
      <div class="filter-bar">
          <div class="input-group" style="margin:0;"><label>Filter Course</label><select id="filter-course"><option value="">All Programs</option></select></div>
          <div class="input-group" style="margin:0;"><label>Filter Day</label><select id="filter-day"><option value="">All Days</option></select></div>
          <div class="input-group" style="margin:0;"><label>Search Faculty</label><input type="text" id="filter-faculty" placeholder="Enter name..."></div>
      </div>

      <div class="tt-wrapper tt-view-wrapper">
        <div id="tt-grid-container"></div>
      </div>
      </div>
    </main>
  </div>

  <!-- Adjustment Modal -->
  <div id="edit-modal" class="modal-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 100%; max-width: 650px;">
        <h3 style="margin-bottom: 2rem; color: var(--primary); text-transform: uppercase; font-weight: 900;">Modify Schedule Cluster</h3>
        <form id="edit-tt-form">
            <input type="hidden" id="edit-id">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                <div class="input-group"><label>Course</label><select id="edit-courseId" required onchange="onEditCourseChange(this.value)"></select></div>
                <div class="input-group"><label>Semester</label><select id="edit-semId" required onchange="onEditSemesterChange(this.value)"></select></div>
                <div class="input-group"><label>Subject</label><select id="edit-subjectId" required onchange="onEditSubjectChange(this.value)"></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
                <div class="input-group"><label>Day</label><select id="edit-day" required><option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option><option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option></select></div>
                <div class="input-group"><label>Slot</label><select id="edit-timeSlot" required><option value="09:00-10:00">09:00 - 10:00</option><option value="10:00-11:00">10:00 - 11:00</option><option value="11:15-12:15">11:15 - 12:15</option><option value="12:15-01:15">12:15 - 01:15</option><option value="02:00-03:00">02:00 - 03:00</option><option value="03:00-04:00">03:00 - 04:00</option><option value="04:00-05:00">04:00 - 05:00</option></select></div>
                <div class="input-group"><label>Room</label><input type="text" id="edit-room" required></div>
            </div>
            <div class="input-group"><label>Verified Faculty</label><select id="edit-facultyId" required disabled></select></div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 2; justify-content: center;">UPDATE SLOT</button>
                <button type="button" class="btn btn-secondary" style="flex: 1; justify-content: center;" onclick="closeEditModal()">CANCEL</button>
                <button type="button" class="btn btn-secondary" style="flex: 1; border-color: var(--danger); color: var(--danger); justify-content: center;" id="delete-tt-btn">PURGE</button>
            </div>
        </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/courses.js"></script>
  <script src="../js/timetable.js"></script>
  <script>
    let courseStructure = [];
    let allEntries = [];

    // Scrolls the timetable to center today's column
    function scrollToToday() {
        const wrapper = document.querySelector('.tt-wrapper');
        const todayTh = document.querySelector('.tt-grid th.current-day');
        if (!wrapper || !todayTh) return;
        const colOffset = todayTh.offsetLeft - (wrapper.clientWidth / 2) + (todayTh.offsetWidth / 2);
        wrapper.scrollTo({ left: colOffset, behavior: 'smooth' });
    }

    // Call this AFTER renderGridView() has run
    function initScrollFeatures() {
        // Show the Today button
        const todayBtn = document.getElementById('scroll-today-btn');
        if (todayBtn) todayBtn.style.display = 'inline-flex';

        // Auto-scroll to today
        setTimeout(scrollToToday, 300);

        const wrapper = document.querySelector('.tt-wrapper');
        if (!wrapper) return;

        // Keyboard: Left/Right arrow keys scroll the grid
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') wrapper.scrollBy({ left: 160, behavior: 'smooth' });
            if (e.key === 'ArrowLeft')  wrapper.scrollBy({ left: -160, behavior: 'smooth' });
        });

        // Desktop drag-to-scroll
        let isDown = false, startX, scrollLeft;
        wrapper.addEventListener('mousedown', e => {
            isDown = true; wrapper.style.cursor = 'grabbing';
            startX = e.pageX - wrapper.offsetLeft; scrollLeft = wrapper.scrollLeft;
        });
        wrapper.addEventListener('mouseleave', () => { isDown = false; wrapper.style.cursor = 'grab'; });
        wrapper.addEventListener('mouseup',   () => { isDown = false; wrapper.style.cursor = 'grab'; });
        wrapper.addEventListener('mousemove', e => {
            if (!isDown) return;
            e.preventDefault();
            wrapper.scrollLeft = scrollLeft - (e.pageX - wrapper.offsetLeft - startX) * 1.5;
        });
        wrapper.style.cursor = 'grab';

        // Hide mobile scroll hint after 3.5s
        setTimeout(() => {
            const hint = document.getElementById('scroll-hint');
            if (hint) hint.style.display = 'none';
        }, 3500);
    }

    document.addEventListener("DOMContentLoaded", async () => {
        checkAuth();
        await loadInitialData();
        await refreshGrid();

        // Filters
        ["filter-course", "filter-day"].forEach(f => document.getElementById(f).onchange = () => renderGrid());
        document.getElementById("filter-faculty").oninput = () => renderGrid();

        // Cleanup
        document.getElementById("cleanup-tt-btn").onclick = async () => {
            if (!confirm("PURGE INCOMPATIBLE RECORDS: This will delete entries lacking relational IDs. Proceed?")) return;
            const broken = allEntries.filter(e => !e.courseId || !e.subjectId);
            if (broken.length === 0) { alert("No incompatible records found."); return; }
            for (const entry of broken) await TimetableService.delete(entry.id);
            alert(`Cleanup complete: ${broken.length} entries removed.`);
            location.reload();
        };

        // Seed
        document.getElementById("seed-tt-btn").onclick = async () => {
            if(!confirm("GENERATE RELATIONAL SEED: Build timetable from curriculum structure?")) return;
            try { await TimetableService.seed(); location.reload(); }
            catch(err) { alert(err.message); }
        };
    });

    async function loadInitialData() {
        try {
            courseStructure = await ApiClient.get("/courses/structure");
            const cList = courseStructure.map(c => `<option value="${c.id}">${c.courseName}</option>`).join('');
            document.getElementById("courseId").innerHTML += cList;
            document.getElementById("filter-course").innerHTML += courseStructure.map(c => `<option value="${c.courseName}">${c.courseName}</option>`).join('');
            
            const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            document.getElementById("filter-day").innerHTML += days.map(d => `<option value="${d}">${d}</option>`).join('');

            // Add cascading listeners
            document.getElementById("courseId").onchange = (e) => onCourseChange(e.target.value);
            document.getElementById("semId").onchange = (e) => onSemesterChange(e.target.value);
            document.getElementById("subjectId").onchange = (e) => onSubjectChange(e.target.value);
        } catch(e) { console.error("Initial load failure", e); }
    }

    async function refreshGrid() {
        allEntries = await TimetableService.getAll();
        renderGrid();
    }

    function renderGrid() {
        const cFilter = document.getElementById("filter-course").value;
        const dFilter = document.getElementById("filter-day").value;
        const fFilter = document.getElementById("filter-faculty").value.toLowerCase();

        const filtered = allEntries.filter(e => {
            const matchesC = !cFilter || e.course === cFilter;
            const matchesD = !dFilter || e.day === dFilter;
            const matchesF = !fFilter || e.facultyName.toLowerCase().includes(fFilter);
            return matchesC && matchesD && matchesF;
        });

        TimetableService.renderGridView("tt-grid-container", filtered, { onEdit: true });
        initScrollFeatures();
    }

    function onCourseChange(cid) {
        const course = courseStructure.find(c => c.id === cid);
        document.getElementById("semId").innerHTML = '<option value="">Select Semester</option>' + (course ? course.semesters.map(s => `<option value="${s.id}">Semester ${s.semesterNumber}</option>`).join('') : '');
    }
    function onSemesterChange(sid) {
        const cid = document.getElementById("courseId").value;
        const sem = courseStructure.find(c => c.id === cid).semesters.find(s => s.id === sid);
        document.getElementById("subjectId").innerHTML = '<option value="">Select Subject</option>' + (sem ? sem.subjects.map(s => `<option value="${s.id}">${s.subjectName}</option>`).join('') : '');
    }
    function onSubjectChange(subid) {
        const cid = document.getElementById("courseId").value;
        const sid = document.getElementById("semId").value;
        const sem = courseStructure.find(c => c.id === cid).semesters.find(s => s.id === sid);
        const sub = sem.subjects.find(s => s.id === subid);
        const facSelect = document.getElementById("facultyId");
        if (sub && sub.facultyId) facSelect.innerHTML = `<option value="${sub.facultyId}" selected>${sub.facultyName}</option>`;
        else facSelect.innerHTML = '<option value="">None</option>';
    }

    document.getElementById("tt-form").onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            courseId: document.getElementById("courseId").value,
            semId: document.getElementById("semId").value,
            subjectId: document.getElementById("subjectId").value,
            facultyId: document.getElementById("facultyId").value,
            day: document.getElementById("day").value, timeSlot: document.getElementById("timeSlot").value,
            room: document.getElementById("room").value
        };
        try { await TimetableService.create(payload); refreshGrid(); alert("SLT AUTHORIZED."); e.target.reset(); }
        catch(err) { alert(err.message); }
    };

    window.openEditModal = (id) => {
        const entry = allEntries.find(e => e.id === id);
        if (!entry) return;
        const isBroken = !entry.courseId || !entry.subjectId;
        document.getElementById("edit-id").value = entry.id;
        if (isBroken) { alert("ERROR: Record is non-relational. Use BATCH PURGE to clear legacy data."); return; }
        
        document.getElementById("edit-day").value = entry.day;
        document.getElementById("edit-timeSlot").value = entry.timeSlot;
        document.getElementById("edit-room").value = entry.room || '';
        const cSel = document.getElementById("edit-courseId");
        cSel.innerHTML = courseStructure.map(c => `<option value="${c.id}">${c.courseName}</option>`).join('');
        cSel.value = entry.courseId;
        onEditCourseChange(entry.courseId);
        document.getElementById("edit-semId").value = entry.semId;
        onEditSemesterChange(entry.semId);
        document.getElementById("edit-subjectId").value = entry.subjectId;
        onEditSubjectChange(entry.subjectId);
        document.getElementById("edit-modal").style.display = "flex";
    };

    function onEditCourseChange(cid) { 
        const course = courseStructure.find(c => c.id === cid);
        document.getElementById("edit-semId").innerHTML = course.semesters.map(s => `<option value="${s.id}">Semester ${s.semesterNumber}</option>`).join('');
    }
    function onEditSemesterChange(sid) {
        const cid = document.getElementById("edit-courseId").value;
        const s = courseStructure.find(c => c.id === cid).semesters.find(x => x.id === sid);
        document.getElementById("edit-subjectId").innerHTML = s.subjects.map(sub => `<option value="${sub.id}">${sub.subjectName}</option>`).join('');
    }
    function onEditSubjectChange(subid) {
        const cid = document.getElementById("edit-courseId").value;
        const sid = document.getElementById("edit-semId").value;
        const sub = courseStructure.find(c=>c.id===cid).semesters.find(x=>x.id===sid).subjects.find(y=>y.id===subid);
        document.getElementById("edit-facultyId").innerHTML = `<option value="${sub.facultyId}">${sub.facultyName}</option>`;
    }

    document.getElementById("edit-tt-form").onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            id: document.getElementById("edit-id").value,
            courseId: document.getElementById("edit-courseId").value,
            semId: document.getElementById("edit-semId").value,
            subjectId: document.getElementById("edit-subjectId").value,
            facultyId: document.getElementById("edit-facultyId").value,
            day: document.getElementById("edit-day").value,
            timeSlot: document.getElementById("edit-timeSlot").value,
            room: document.getElementById("edit-room").value
        };
        try { await TimetableService.update(payload); location.reload(); }
        catch(err) { alert(err.message); }
    };

    document.getElementById("delete-tt-btn").onclick = async () => {
        if (confirm("PURGE CONFIRMATION: Permanently remove this allocation?")) { 
            await TimetableService.delete(document.getElementById("edit-id").value);
            location.reload();
        }
    };
    window.closeEditModal = () => document.getElementById("edit-modal").style.display = "none";
  </script>
</body>
</html>

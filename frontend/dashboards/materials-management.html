<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Control Matrix | Acadex</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-layout">
    <nav class="sidebar"></nav>

    <main class="main-content">
      <div class="container">
      <!-- Navbar auto-injected by layout.js -->

      <div class="header-row">
        <div>
          <h2>Asset Control Matrix</h2>
          <p style="color: var(--text-secondary);">Administrative registry over structural academic resources and uploaded materials</p>
        </div>
        <div id="admin-actions">
           <button class="btn btn-primary" onclick="window.location.href='add-material.html'"><i class="fas fa-bolt"></i> DEPLOY NEW ASSET</button>
        </div>
      </div>

      <div class="glass-card" style="margin-top: 2.5rem; padding: 0; overflow: hidden; border-width: 2px;">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Asset Identity (Title)</th>
                <th>Academic Domain</th>
                <th>Upload Timestamp</th>
                <th style="text-align: right;">Operations</th>
              </tr>
            </thead>
            <tbody id="materials-tbody">
               <tr><td colspan="4" style="text-align: center; padding: 4rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">Synchronizing asset matrix...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/assignments.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      checkAuth();
      const user = JSON.parse(localStorage.getItem("acadex_user"));
      if (user && user.role === 'student') return window.location.href = "unauthorized.html";
      
      fetchData();
    });

    async function fetchData() {
        const tbody = document.getElementById("materials-tbody");
        try {
            const materials = await MaterialService.getAll();
            if(!materials || materials.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 4rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">No institutional assets discovered.</td></tr>';
                return;
            }

            tbody.innerHTML = materials.map(m => `
                <tr>
                    <td>
                      <div style="font-weight: 900; text-transform: uppercase; color: var(--primary);">${m.title}</div>
                      <div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; font-weight: 700; text-transform: uppercase;">${m.courseId} / ${m.subjectName}</div>
                    </td>
                    <td style="font-weight: 800; text-transform: uppercase; font-size: 0.75rem;">${m.subjectName}</td>
                    <td>
                      <div style="font-weight: 900; font-family: monospace;">${new Date(m.createdAt).toLocaleDateString('en-GB')}</div>
                      <div style="font-size: 0.7rem; color: var(--text-secondary); font-weight: 800; text-transform: uppercase;">${new Date(m.createdAt).toLocaleTimeString('en-GB')}</div>
                    </td>
                    <td style="text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">
                        <a href="${m.fileUrl}" target="_blank" class="btn btn-secondary" style="font-size: 0.65rem; padding: 0.4rem 0.8rem;"><i class="fas fa-external-link-alt"></i> ACCESS</a>
                        <a href="edit-material.html?id=${m.id}" class="btn btn-primary" style="font-size: 0.65rem; padding: 0.4rem 0.8rem; background: var(--info); border-color: var(--border-bold);"><i class="fas fa-edit"></i></a>
                        <button class="btn btn-danger" onclick="deleteMaterial('${m.id}')" style="font-size: 0.65rem; padding: 0.4rem 0.8rem;"><i class="fas fa-trash"></i> PURGE</button>
                    </td>
                </tr>
            `).join('');
        } catch(e) { 
            console.error(e); 
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 2rem; color: var(--danger); font-weight: 900;">MATRIX SYNC FAILURE: ${e.message.toUpperCase()}</td></tr>`;
        }
    }

    async function deleteMaterial(id) {
        if (!confirm("CRITICAL WARNING: Permanently purge this academic asset from the registry?")) return;
        try {
            // Frontend Sync Requirement
            console.log("Committing archive request...");
            await ApiClient.delete(`/materials/delete?id=${id}`);
            console.log("Response: Successfully Deleted");
            alert("ASSET PERMANENTLY PURGED.");
            await fetchData(); // Full state re-render
        } catch(e) {
            alert("DELETION ERROR: " + e.message);
        }
    }
  </script>
</body>
</html>
